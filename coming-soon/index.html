<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Brewnok is launching soon. Countdown to September 13, 2026 at 12:00 AM IST.">
  <title>Brewnok — Something New is Brewing</title>

  <!-- Favicon using brand logo -->
  <link rel="icon" type="image/png" href="brewnok-logo.png">
  <link rel="apple-touch-icon" href="brewnok-logo.png">

  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-top" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom" aria-hidden="true"></div>
  <div class="ambient-noise" aria-hidden="true"></div>

  <div class="page-wrapper">
    <!-- Navigation / Header -->
    <header class="header">
      <div class="header-inner">
        <a href="#" class="brand-link" aria-label="Brewnok Home">
          <img src="brewnok-logo.png" alt="Brewnok logo" class="logo">
        </a>

        <div class="header-actions">
          <div class="status-pill">
            <span class="status-dot"></span>
            <span class="status-text">Phase 1 Brewing</span>
          </div>

          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle visual theme" title="Toggle theme">
            <!-- Sun Icon (shown in dark mode) -->
            <svg class="theme-icon icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <!-- Moon Icon (shown in light mode) -->
            <svg class="theme-icon icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <section class="hero-section" aria-labelledby="hero-title">
        <!-- Eyebrow Badge -->
        <div class="eyebrow-badge">
          <span class="badge-sparkle">✦</span>
          <span>Mark The Date • 13 September 2026</span>
        </div>

        <!-- Headline & Subtitle -->
        <h1 id="hero-title" class="hero-title">
          Something new is <span class="gradient-text">brewing.</span>
        </h1>
        <!-- <p class="hero-subtitle">
          We’re crafting a distinctive experience from the ground up. The countdown to our official premiere has begun.
        </p> -->

        <!-- Countdown Card Container -->
        <div class="countdown-container" aria-label="Countdown to Launch">
          <div class="countdown-grid">
            <!-- Days -->
            <div class="timer-card" data-unit="days">
              <div class="timer-card-inner">
                <span id="days" class="timer-number">00</span>
                <span class="timer-label">Days</span>
              </div>
              <div class="card-glow"></div>
            </div>

            <div class="timer-separator" aria-hidden="true">/</div>

            <!-- Hours -->
            <div class="timer-card" data-unit="hours">
              <div class="timer-card-inner">
                <span id="hours" class="timer-number">00</span>
                <span class="timer-label">Hours</span>
              </div>
              <div class="card-glow"></div>
            </div>

            <div class="timer-separator" aria-hidden="true">/</div>

            <!-- Minutes -->
            <div class="timer-card" data-unit="minutes">
              <div class="timer-card-inner">
                <span id="minutes" class="timer-number">00</span>
                <span class="timer-label">Minutes</span>
              </div>
              <div class="card-glow"></div>
            </div>

            <div class="timer-separator" aria-hidden="true">/</div>

            <!-- Seconds -->
            <div class="timer-card" data-unit="seconds">
              <div class="timer-card-inner">
                <span id="seconds" class="timer-number">00</span>
                <span class="timer-label">Seconds</span>
              </div>
              <div class="card-glow"></div>
            </div>
          </div>

          <div class="target-meta">
            <span class="meta-clock-icon">◷</span>
            <span id="status" class="status-detail">Targeting 12:00 AM IST (UTC+05:30)</span>
          </div>
        </div>

        <!-- Waitlist / Notification Form -->
        
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="footer-copy">© 2026 Brewnok. All rights reserved.</span>
        </div>
        <div class="footer-links">
          <span class="footer-tagline">Crafted with precision.</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
