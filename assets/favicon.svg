<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" fill="#23343a" rx="40"/>
  
  <!-- Tech inspired design - stylized B -->
  <g fill="#ededed">
    <!-- Left vertical bar -->
    <rect x="40" y="40" width="20" height="100" rx="4"/>
    
    <!-- Top curve of B -->
    <path d="M 60 40 Q 90 40 90 65 Q 90 85 60 85 L 60 85 Z" fill="#ededed"/>
    
    <!-- Bottom curve of B -->
    <path d="M 60 85 Q 95 85 95 110 Q 95 140 60 140 L 60 140 Z" fill="#ededed"/>
  </g>
  
  <!-- Accent dots for tech feel -->
  <circle cx="125" cy="60" r="8" fill="#FFB703"/>
  <circle cx="140" cy="110" r="6" fill="#FFB703"/>
  <circle cx="125" cy="135" r="7" fill="#FFB703"/>
</svg>
